<header class="topbar">
  <button mat-icon-button class="topbar__menu-btn" (click)="menuToggle.emit()" aria-label="Toggle menu">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="topbar__spacer"></div>

  <div class="topbar__search">
    <mat-icon class="topbar__search-icon">search</mat-icon>
    <input type="text" class="topbar__search-input" placeholder="Search employees, clients, sites..." aria-label="Global search">
  </div>

  <div class="topbar__actions">
    <button mat-icon-button class="topbar__action-btn" (click)="themeService.toggle()" [matTooltip]="themeService.isDark() ? 'Light mode' : 'Dark mode'" [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <signet-action-menu
      align="end"
      triggerType="custom"
      panelClass="topbar__notifications-menu"
      ariaLabel="Notifications"
      (opened)="onNotificationsMenuOpened()"
    >
      <button
        type="button"
        actionMenuTrigger
        mat-icon-button
        class="topbar__action-btn"
        matTooltip="Notifications"
        aria-label="Notifications"
      >
        <mat-icon
          aria-hidden="false"
          [matBadge]="unreadCount() || null"
          matBadgeColor="warn"
          matBadgeSize="small"
          [matBadgeHidden]="unreadCount() === 0">
          notifications
        </mat-icon>
      </button>

      <div class="topbar__notifications-header" actionMenuKeepOpen>
        <span>Notifications</span>
        <button
          type="button"
          class="topbar__notifications-mark-all"
          *ngIf="unreadCount() > 0"
          actionMenuKeepOpen
          (click)="markAllRead(); $event.stopPropagation()"
        >
          Mark all read
        </button>
      </div>
      <div class="topbar__notifications-empty" *ngIf="!loadingNotifications() && notifications().length === 0">
        No notifications
      </div>
      <button
        type="button"
        actionMenuItem
        *ngFor="let item of notifications()"
        (click)="openNotification(item)"
        [class.topbar__notification--unread]="!item.isRead"
      >
        <div class="topbar__notification-item">
          <strong>{{ item.title }}</strong>
          <span>{{ item.message }}</span>
          <small>{{ item.createdAt | date:'short' }}</small>
        </div>
      </button>
    </signet-action-menu>

    <signet-action-menu align="end" triggerType="custom" ariaLabel="User account menu">
      <button type="button" actionMenuTrigger class="topbar__user-btn" aria-label="User account menu">
        <div class="topbar__user-avatar">
          {{ (authService.userFullName() || 'U').charAt(0).toUpperCase() }}
        </div>
        <mat-icon class="topbar__user-caret">expand_more</mat-icon>
      </button>

      <a actionMenuItem routerLink="/auth/profile">
        <mat-icon>person</mat-icon>
        <span>My Profile</span>
      </a>
      <a actionMenuItem routerLink="/auth/change-password">
        <mat-icon>lock</mat-icon>
        <span>Change Password</span>
      </a>
      <a actionMenuItem routerLink="/settings">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </a>
      <div class="action-menu__divider" role="separator"></div>
      <button type="button" actionMenuItem class="action-delete" (click)="authService.logout()">
        <mat-icon>logout</mat-icon>
        <span class="topbar__logout">Sign Out</span>
      </button>
    </signet-action-menu>
  </div>
</header>
