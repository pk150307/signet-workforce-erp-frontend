<div class="action-menu" [class.action-menu--open]="isOpen">
  <div class="action-menu__trigger" (click)="toggle($event)">
    <ng-content select="[actionMenuTrigger]"></ng-content>

    @if (!hasCustomTrigger && triggerType === 'icon') {
      <button
        type="button"
        class="action-menu__icon-btn"
        [attr.aria-label]="ariaLabel"
        [attr.aria-expanded]="isOpen"
      >
        <mat-icon>{{ triggerIcon }}</mat-icon>
      </button>
    }

    @if (!hasCustomTrigger && triggerType === 'button') {
      <button
        type="button"
        class="action-menu__text-btn"
        [attr.aria-label]="ariaLabel"
        [attr.aria-expanded]="isOpen"
      >
        <span>{{ triggerLabel }}</span>
        <span class="action-menu__caret" [class.action-menu__caret--open]="isOpen">
          <mat-icon>expand_more</mat-icon>
        </span>
      </button>
    }
  </div>

  <div
    class="action-menu__panel"
    [class.action-menu__panel--visible]="isOpen"
    [ngClass]="panelClass"
    [ngStyle]="panelStyles"
    role="menu"
    [attr.inert]="isOpen ? null : ''"
    (click)="onPanelClick($event)"
  >
    <div class="action-menu__options">
      <ng-content></ng-content>

      @for (item of visibleItems; track item.id) {
        @if (item.dividerBefore) {
          <div class="action-menu__divider" role="separator"></div>
        }
        <button
          type="button"
          class="action-menu__item"
          [class.action-menu__item--danger]="item.danger"
          [class.action-menu__item--disabled]="item.disabled"
          [disabled]="item.disabled"
          role="menuitem"
          (click)="onItemClick(item, $event)"
        >
          @if (item.icon) {
            <mat-icon>{{ item.icon }}</mat-icon>
          }
          <span class="action-menu__item-content">
            <span class="action-menu__item-label">{{ item.label }}</span>
            @if (item.description) {
              <span class="action-menu__item-description">{{ item.description }}</span>
            }
            @if (item.meta) {
              <span class="action-menu__item-meta">{{ item.meta }}</span>
            }
          </span>
        </button>
      }
    </div>
  </div>
</div>
