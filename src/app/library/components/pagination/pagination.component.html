<div
  class="pagination-section"
  [style.width]="width + widthUnit"
  [style.min-height]="height + heightUnit"
>
  <div class="pagination-section__meta" *ngIf="showPageSize">
    <div class="pagination-section__page-size">
      <span class="pagination-section__page-size-label">Rows per page</span>
      <signet-search-select-dropdown
        class="pagination-section__page-size-dropdown"
        [value]="selectedPageSize"
        [options]="pageSizeSelectOptions"
        fieldTitle=""
        placeholder="10"
        [width]="96"
        widthUnit="px"
        [searchFunctionality]="false"
        [required]="false"
        dropdownPlacement="top"
        [dropdownOptionMaxHeight]="'220px'"
        (valueChange)="onPageSizeChange($event)"
      />
    </div>
  </div>

  <div class="pagination-section__actions">
    <button
      type="button"
      class="pagination-section__previous"
      [class.disabled]="!canGoPrev"
      [disabled]="!canGoPrev"
      [attr.tabindex]="canGoPrev ? '0' : '-1'"
      (click)="onPrevious()"
    >
      Previous
    </button>

    <button
      type="button"
      class="pagination-section__next"
      [class.disabled]="!canGoNext"
      [disabled]="!canGoNext"
      [attr.tabindex]="canGoNext ? '0' : '-1'"
      (click)="onNext()"
    >
      Next
    </button>
  </div>
</div>
