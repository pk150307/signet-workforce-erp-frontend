<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-header__title">Sites</h1>
      <p class="page-header__subtitle">{{ data()?.items?.length ?? 0 }} locations across clients</p>
    </div>
    <div class="page-header__actions">
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Action" (clicked)="load()" />
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Dashboard" (clicked)="router.navigate(['/sites/dashboard'])" />
      <signet-button [width]="100" [widthUnit]="'%'" type="primary" displayText="Add Site" (clicked)="router.navigate(['/sites/new'])" />
    </div>
  </div>

  <div class="filters-card card">
    <signet-custom-text-field
      class="filters-card__search"
      [formControl]="searchCtrl"
      fieldTitle="Search sites"
      placeholder="Name, code, or client"
      [required]="false"
    />
    <signet-search-select-dropdown
      class="filters-card__client"
      [formControl]="clientCtrl"
      fieldTitle="Client"
      placeholder="All clients"
      [options]="clientOptions()"
      [width]="100"
      widthUnit="%"
      [searchFunctionality]="true"
      [required]="false"
    />
    <signet-search-select-dropdown
      class="filters-card__status"
      [formControl]="statusCtrl"
      fieldTitle="Status"
      placeholder="All"
      [options]="statusOptions()"
      [width]="100"
      widthUnit="%"
      [searchFunctionality]="false"
      [required]="false"
    />
    <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Clear filters" class="filters-card__clear" (clicked)="clearFilters()" />
  </div>

  <app-skeleton-loader *ngIf="loading()" type="table" [rows]="6"></app-skeleton-loader>

  <div class="card card--flush" *ngIf="!loading()">
    <app-empty-state
      *ngIf="data()?.items?.length === 0"
      icon="location_on"
      title="No sites found"
      description="Try adjusting your search or client filter.">
    </app-empty-state>

    <div class="data-list-scroll" *ngIf="(data()?.items?.length ?? 0) > 0">
      <div class="data-list">
        <div class="data-list__header">
          <div class="data-list__cell">Code</div>
          <div class="data-list__cell">Site</div>
          <div class="data-list__cell">Client</div>
          <div class="data-list__cell">City</div>
          <div class="data-list__cell">Required</div>
          <div class="data-list__cell">Deployed</div>
          <div class="data-list__cell">Status</div>
          <div class="data-list__cell data-list__cell--center"></div>
        </div>
        @for (s of data()?.items ?? []; track s.id) {
          <div class="data-list__row">
            <div class="data-list__cell"><span class="code-chip">{{ s.siteCode }}</span></div>
            <div class="data-list__cell"><strong>{{ s.siteName }}</strong></div>
            <div class="data-list__cell">{{ s.clientCompanyName }}</div>
            <div class="data-list__cell">{{ s.city }}</div>
            <div class="data-list__cell">{{ s.requiredHeadcount }}</div>
            <div class="data-list__cell">{{ s.deployedHeadcount }}</div>
            <div class="data-list__cell">
              <signet-status-button [label]="s.isActive ? 'Active' : 'Inactive'" [status]="s.isActive" />
            </div>
            <div class="data-list__cell data-list__cell--center">
              <signet-action-menu ariaLabel="More actions">
                <button type="button" actionMenuItem (click)="viewSite(s.id)">
                  <mat-icon>visibility</mat-icon><span>View</span>
                </button>
                <a actionMenuItem [routerLink]="['/sites', s.id, 'edit']">
                  <mat-icon>edit</mat-icon><span>Edit</span>
                </a>
                <button type="button" actionMenuItem class="action-menu__item--danger" (click)="deleteSite(s)">
                  <mat-icon>delete</mat-icon><span>Delete</span>
                </button>
              </signet-action-menu>
            </div>
          </div>
        }
      </div>
    </div>

<signet-pagination
      *ngIf="data()"
      [hasPrev]="pager.hasPrev"
      [hasNext]="pager.hasNext"
      [prevCursor]="pager.currentPrevCursor"
      [nextCursor]="pager.currentNextCursor"
      [pageSize]="pager.pageSize"
      (pageChange)="onPaginationNavigate($event)"
    />
  </div>
</div>
