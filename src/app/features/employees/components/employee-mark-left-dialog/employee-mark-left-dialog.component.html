<h2 mat-dialog-title>Mark Employee as Left</h2>

<mat-dialog-content>
  <p class="dialog-intro">
    Record exit for <strong>{{ data.employee.fullName }}</strong> ({{ data.employee.employeeCode }}).
  </p>

  <form [formGroup]="form" class="dialog-form">
    <signet-date-input-field
      fieldTitle="Last Working Date"
      placeholder="Select last working date"
      [value]="dateToSignetValue(form.get('lastWorkingDate')?.value)"
      (valueChange)="onLastWorkingDateChange($event)"
      [required]="true"
      [showError]="!!(form.controls.lastWorkingDate.hasError('required') && form.controls.lastWorkingDate.touched)"
      errorMessage="Required"
      [width]="100"
      widthUnit="%"
    />

    <signet-search-select-dropdown
      formControlName="reason"
      fieldTitle="Reason"
      placeholder="Select reason"
      [options]="reasonOptions()"
      [width]="100"
      widthUnit="%"
      [searchFunctionality]="false"
    />

    <signet-custom-text-area-field
      formControlName="remarks"
      fieldTitle="Remarks (optional)"
      [required]="false"
      [width]="100"
      widthUnit="%"
    />
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Cancel" (clicked)="cancel()" [disabled]="saving()" />
  <signet-button [width]="100" [widthUnit]="'%'" type="error" [displayText]="saving() ? 'Saving…' : 'Mark as Left'" (clicked)="submit()" [disabled]="saving()" />
</mat-dialog-actions>
