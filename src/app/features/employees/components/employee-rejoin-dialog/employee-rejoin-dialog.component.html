<h2 mat-dialog-title>Rejoin Employee</h2>

<mat-dialog-content class="rejoin-dialog__content">
  <p class="dialog-intro">
    Reactivate <strong>{{ data.employee.fullName }}</strong> ({{ data.employee.employeeCode }}) with new employment details.
  </p>

  @if (loading() || saving()) {
    <app-skeleton-loader type="card" [rows]="5"></app-skeleton-loader>
  } @else {
    <form [formGroup]="form" class="dialog-form">
      <signet-date-input-field
        fieldTitle="Rejoin Date"
        placeholder="Select rejoin date"
        [value]="dateToSignetValue(form.get('joiningDate')?.value)"
        (valueChange)="onJoiningDateChange($event)"
        [required]="true"
        [width]="100"
        widthUnit="%"
      />

      <signet-search-select-dropdown
        formControlName="departmentId"
        fieldTitle="Department"
        placeholder="Select department"
        [options]="departmentOptions()"
        [width]="100"
        widthUnit="%"
        [searchFunctionality]="true"
        dropdownPlacement="bottom"
        [dropdownOptionMaxHeight]="'180px'"
      />

      <signet-search-select-dropdown
        formControlName="designationId"
        fieldTitle="Designation"
        placeholder="Select designation"
        [options]="designationOptions()"
        [disabled]="!selectedDepartmentId() || designationsLoading()"
        [width]="100"
        widthUnit="%"
        [searchFunctionality]="true"
        dropdownPlacement="bottom"
        [dropdownOptionMaxHeight]="'180px'"
      />

      <signet-search-select-dropdown
        formControlName="siteId"
        fieldTitle="Site (optional)"
        placeholder="None"
        [options]="siteOptions()"
        [required]="false"
        [width]="100"
        widthUnit="%"
        [searchFunctionality]="true"
        dropdownPlacement="bottom"
        [dropdownOptionMaxHeight]="'160px'"
      />

      <signet-custom-checkbox
        formControlName="reuseEmployeeCode"
        permissionKey="reuseEmployeeCode"
        [label]="'Reuse existing employee code (' + data.employee.employeeCode + ')'"
      />
    </form>
  }
</mat-dialog-content>

<mat-dialog-actions align="end" class="rejoin-dialog__actions">
  <signet-button type="stroke" displayText="Cancel" (clicked)="cancel()" [disabled]="saving()" />
  <signet-button type="primary" displayText="Rejoin Employee" (clicked)="submit()" [disabled]="saving() || loading()" />
</mat-dialog-actions>
