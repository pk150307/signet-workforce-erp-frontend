<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-header__title">Branches</h1>
      <p class="page-header__subtitle">{{ data()?.items?.length ?? 0 }} branches</p>
    </div>
    <div class="page-header__actions">
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Company Profile" (clicked)="router.navigate(['/company'])" />
      <signet-button [width]="100" [widthUnit]="'%'" type="primary" displayText="Add Branch" (clicked)="openCreate()" />
    </div>
  </div>

  <div class="filter-bar">
    <signet-custom-text-field
      class="filter-bar__search"
      [formControl]="searchCtrl"
      fieldTitle="Search branches..."
      placeholder="Search branches..."
      [required]="false"
    />
    <div class="filter-bar__filters">
      <signet-search-select-dropdown
        class="filter-field--inline"
        [formControl]="statusCtrl"
        fieldTitle="Status"
        placeholder="All"
        [options]="statusOptions()"
        [width]="100"
        widthUnit="%"
        [searchFunctionality]="false"
        [required]="false"
      />
    </div>
    <div class="filter-bar__actions">
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Clear" (clicked)="clearFilters()" />
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Refresh" (clicked)="load()" />
    </div>
  </div>

  <app-skeleton-loader *ngIf="loading()" type="table" [rows]="6"></app-skeleton-loader>

  <div class="card card--flush" *ngIf="!loading()">
    <div class="empty-state" *ngIf="data()?.items?.length === 0">
      <mat-icon>account_tree</mat-icon>
      <h3>No branches found</h3>
      <p>Add a branch or adjust your filters.</p>
      <signet-button [width]="100" [widthUnit]="'%'" type="primary" displayText="Add Branch" (clicked)="openCreate()" />
    </div>
    <div class="data-list-scroll" *ngIf="(data()?.items?.length ?? 0) > 0">
      <div class="data-list">
        <div class="data-list__header">
          <div class="data-list__cell">Code</div>
          <div class="data-list__cell">Branch</div>
          <div class="data-list__cell">Location</div>
          <div class="data-list__cell">Headcount</div>
          <div class="data-list__cell">Status</div>
          <div class="data-list__cell data-list__cell--center"></div>
        </div>
        @for (b of data()?.items ?? []; track b.id) {
          <div class="data-list__row">
            <div class="data-list__cell"><span class="code-chip">{{ b.branchCode }}</span></div>
            <div class="data-list__cell"><strong>{{ b.branchName }}</strong></div>
            <div class="data-list__cell">{{ b.city }}, {{ b.state }}</div>
            <div class="data-list__cell">{{ b.headCount }}</div>
            <div class="data-list__cell">
              <signet-status-button [label]="b.isActive ? 'Active' : 'Inactive'" [status]="b.isActive" />
            </div>
            <div class="data-list__cell data-list__cell--center">
              <signet-action-menu ariaLabel="More actions">
                <button type="button" actionMenuItem (click)="openEdit(b)">
                  <mat-icon>edit</mat-icon><span>Edit</span>
                </button>
                <button type="button" actionMenuItem class="action-delete" (click)="deleteBranch(b)">
                  <mat-icon>delete</mat-icon><span>Delete</span>
                </button>
              </signet-action-menu>
            </div>
          </div>
        }
      </div>
    </div>
<signet-pagination
      *ngIf="data()"
      [hasPrev]="pager.hasPrev"
      [hasNext]="pager.hasNext"
      [prevCursor]="pager.currentPrevCursor"
      [nextCursor]="pager.currentNextCursor"
      [pageSize]="pager.pageSize"
      (pageChange)="onPaginationNavigate($event)"
    />
  </div>
</div>
