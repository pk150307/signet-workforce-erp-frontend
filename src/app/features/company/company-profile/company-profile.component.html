<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-header__title">Company Profile</h1>
      <p class="page-header__subtitle">Manage company information, GST, billing, and logo</p>
    </div>
    <div class="page-header__actions">
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Branches" (clicked)="router.navigate(['/company/branches'])" />
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Offices" (clicked)="router.navigate(['/company/offices'])" />
    </div>
  </div>

  <app-skeleton-loader *ngIf="loading() || saving()" type="card" [rows]="8"></app-skeleton-loader>

  <div class="card" *ngIf="!loading() && !saving()">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="logo-section">
        <div class="logo-section__preview">
          <img *ngIf="logoPreview()" [src]="logoPreview()" alt="Company logo">
          <mat-icon *ngIf="!logoPreview()">business</mat-icon>
        </div>
        <div class="logo-section__actions">
          <label for="company-logo-input" class="logo-section__title">Company Logo</label>
          <p id="company-logo-hint">Upload PNG or JPG, max 2 MB. Recommended 200×200 px.</p>
          <input
            id="company-logo-input"
            type="file"
            #logoInput
            accept="image/png,image/jpeg"
            hidden
            aria-describedby="company-logo-hint"
            (change)="onLogoSelected($event)">
          <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Upload Logo" (clicked)="logoInput.click()" />
        </div>
      </div>

      <mat-divider></mat-divider>

      <div class="detail-sections">
        <signet-sections-navigator
          class="detail-sections__nav"
          [navigationItems]="sectionItems"
          [selectedItem]="activeSection()"
          [activeBackgroundColour]="'var(--color-primary)'"
          [borderColor]="'var(--color-border)'"
          [backgroundColor]="'var(--color-bg-subtle)'"
          height="48px"
          (selectedItemChange)="activeSection.set($event)"
        />

        @if (activeSection() === 'info') {
          <div class="tab-content">
            <div class="form-row">
              <signet-custom-text-field formControlName="companyName" fieldTitle="Company Name" [required]="true" />
              <signet-custom-text-field formControlName="legalName" fieldTitle="Legal Name" [required]="true" />
            </div>
            <div class="form-row">
              <signet-custom-text-field formControlName="registrationNumber" fieldTitle="Registration Number" [required]="false" />
              <signet-custom-text-field formControlName="email" fieldTitle="Email" type="email" [required]="true" />
              <signet-custom-text-field formControlName="phone" fieldTitle="Phone" [required]="true" />
            </div>
            <div class="form-row">
              <signet-custom-text-field formControlName="website" fieldTitle="Website" [required]="false" />
            </div>
            <signet-custom-text-area-field
              formControlName="address"
              fieldTitle="Address"
              [required]="true"
              [width]="100"
              widthUnit="%"
            />
            <div class="form-row">
              <signet-custom-text-field formControlName="city" fieldTitle="City" [required]="true" />
              <signet-custom-text-field formControlName="state" fieldTitle="State" [required]="true" />
              <signet-custom-text-field formControlName="pinCode" fieldTitle="PIN Code" [required]="false" />
            </div>
          </div>
        }

        @if (activeSection() === 'gst') {
          <div class="tab-content">
            <div class="form-row">
              <signet-custom-text-field
                formControlName="gstNumber"
                fieldTitle="GST Number"
                placeholder="e.g. 27AABCS1234F1Z5"
                [required]="false"
              />
              <signet-custom-text-field
                formControlName="panNumber"
                fieldTitle="PAN Number"
                placeholder="e.g. AABCS1234F"
                [required]="false"
              />
            </div>
          </div>
        }

        @if (activeSection() === 'billing') {
          <div class="tab-content">
            <div class="billing-actions">
              <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Copy from company address" (clicked)="copyBillingFromCompany()" />
            </div>
            <signet-custom-text-area-field
              formControlName="billingAddress"
              fieldTitle="Billing Address"
              [required]="false"
              [width]="100"
              widthUnit="%"
            />
            <div class="form-row">
              <signet-custom-text-field formControlName="billingCity" fieldTitle="City" [required]="false" />
              <signet-custom-text-field formControlName="billingState" fieldTitle="State" [required]="false" />
              <signet-custom-text-field formControlName="billingPinCode" fieldTitle="PIN Code" [required]="false" />
            </div>
          </div>
        }
      </div>

      <div class="form-actions">
        <signet-button [width]="100" [widthUnit]="'%'" type="primary" displayText="Save Changes" [disabled]="saving()" (clicked)="onSubmit()" />
      </div>
    </form>
  </div>
</div>
