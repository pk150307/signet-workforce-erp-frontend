<div class="page-container">
  <div class="page-header"><div><h1 class="page-header__title">Monthly Attendance</h1><p class="page-header__subtitle">{{ data()?.items?.length ?? 0 }} records</p></div>
    <div class="page-header__actions"><signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Refresh" (clicked)="load()" /></div></div>
  <div class="filter-bar"><signet-custom-text-field class="filter-bar__search" fieldTitle="Search" [formControl]="searchCtrl" placeholder="Search..." [required]="false" /></div>
  <app-skeleton-loader *ngIf="loading()" type="table" [rows]="6"></app-skeleton-loader>
  <div class="card card--flush" *ngIf="!loading()">
    <app-empty-state *ngIf="data()?.items?.length === 0" icon="event_available" title="No records" description="No attendance records found."></app-empty-state>
    <div class="data-list-scroll" *ngIf="(data()?.items?.length ?? 0) > 0">
      <div class="data-list">
        <div class="data-list__header">
          <div class="data-list__cell">Employee</div>
          <div class="data-list__cell">Code</div>
          <div class="data-list__cell">Date</div>
          <div class="data-list__cell">Status</div>
          <div class="data-list__cell">Hours</div>
          <div class="data-list__cell">Site</div>
        </div>
        @for (row of data()?.items ?? []; track row.id) {
          <div class="data-list__row">
            <div class="data-list__cell">{{ row.employeeName }}</div>
            <div class="data-list__cell">{{ row.employeeCode }}</div>
            <div class="data-list__cell">{{ row.attendanceDate }}</div>
            <div class="data-list__cell">{{ row.status }}</div>
            <div class="data-list__cell">{{ row.workingHours ?? '—' }}</div>
            <div class="data-list__cell">{{ row.siteName }}</div>
          </div>
        }
      </div>
    </div>
<signet-pagination
      *ngIf="data()"
      [hasPrev]="pager.hasPrev"
      [hasNext]="pager.hasNext"
      [prevCursor]="pager.currentPrevCursor"
      [nextCursor]="pager.currentNextCursor"
      [pageSize]="pager.pageSize"
      (pageChange)="onPaginationNavigate($event)"
    />
</div></div>
