<div class="page-container">
  <div class="page-header"><div><h1 class="page-header__title">Attendance Correction</h1><p class="page-header__subtitle">{{ data()?.items?.length ?? 0 }} correction requests</p></div>
    <div class="page-header__actions"><signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Refresh" (clicked)="load()" /></div></div>
  <app-skeleton-loader *ngIf="loading()" type="table" [rows]="5"></app-skeleton-loader>
  <div class="card card--flush" *ngIf="!loading()">
    <app-empty-state *ngIf="data()?.items?.length === 0" icon="edit_note" title="No corrections" description="No pending attendance correction requests."></app-empty-state>
    <div class="data-list-scroll" *ngIf="(data()?.items?.length ?? 0) > 0">
      <div class="data-list">
        <div class="data-list__header">
          <div class="data-list__cell">Employee</div>
          <div class="data-list__cell">Date</div>
          <div class="data-list__cell">Current</div>
          <div class="data-list__cell">Requested</div>
          <div class="data-list__cell">Reason</div>
          <div class="data-list__cell">Status</div>
        </div>
        @for (row of data()?.items ?? []; track row.id ?? $index) {
          <div class="data-list__row">
            <div class="data-list__cell">{{ row.employeeName }}</div>
            <div class="data-list__cell">{{ row.date }}</div>
            <div class="data-list__cell">{{ row.currentStatus }}</div>
            <div class="data-list__cell">{{ row.requestedStatus }}</div>
            <div class="data-list__cell">{{ row.reason }}</div>
            <div class="data-list__cell">
              <signet-status-button [label]="row.status" [status]="row.status" />
            </div>
          </div>
        }
      </div>
    </div>
    <signet-pagination
      *ngIf="data()"
      [hasPrev]="pager.hasPrev"
      [hasNext]="pager.hasNext"
      [prevCursor]="pager.currentPrevCursor"
      [nextCursor]="pager.currentNextCursor"
      [pageSize]="pager.pageSize"
      (pageChange)="onPaginationNavigate($event)"
    />
  </div></div>
