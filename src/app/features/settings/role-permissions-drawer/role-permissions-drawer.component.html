<div class="role-permissions-drawer">
  <div class="role-permissions-drawer__header">
    <div>
      <h2>Permission Matrix</h2>
      <p *ngIf="role() as r">{{ r.name }}</p>
    </div>
    <button mat-icon-button (click)="close()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <app-skeleton-loader *ngIf="loading()" type="card" [rows]="8"></app-skeleton-loader>

  <div *ngIf="!loading()" class="role-permissions-drawer__body">
    <mat-accordion multi>
      <mat-expansion-panel *ngFor="let group of groups()">
        <mat-expansion-panel-header>
          <mat-panel-title>{{ group.module }}</mat-panel-title>
          <mat-panel-description>{{ group.permissions.length }} permissions</mat-panel-description>
        </mat-expansion-panel-header>

        <div class="role-permissions-drawer__module-actions">
          <signet-button [width]="100" [widthUnit]="'%'" type="hollow" displayText="Select all" (clicked)="toggleModule(group, true)" />
          <signet-button [width]="100" [widthUnit]="'%'" type="hollow" displayText="Clear" (clicked)="toggleModule(group, false)" />
        </div>

        <div class="role-permissions-drawer__permission" *ngFor="let perm of group.permissions">
          <div class="role-permissions-drawer__permission-row">
            <signet-custom-checkbox [checked]="isChecked(perm.id)" [disabled]="!canUpdate || (role()?.isSystem ?? false)" (permissionToggled)="toggle(perm.id, $event.checked)" [label]="perm.key" permissionKey="perm" groupName="permissions" />
            <span class="role-permissions-drawer__perm-desc" *ngIf="perm.description">{{ perm.description }}</span>
          </div>
        </div>
      </mat-expansion-panel>
    </mat-accordion>
  </div>

  <div class="role-permissions-drawer__actions">
    <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Cancel" (clicked)="close()" />
    <signet-button [width]="100" [widthUnit]="'%'" type="primary" [displayText]="saving() ? 'Saving…' : 'Save Permissions'" [disabled]="saving() || !canUpdate || (role()?.isSystem ?? false)" (clicked)="save()" />
  </div>
</div>
