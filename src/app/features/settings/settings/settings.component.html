<div class="page-container settings-page">
  <app-settings-subnav></app-settings-subnav>

  <section class="settings-hero">
    <div class="settings-hero__content">
      <div class="settings-hero__icon"><mat-icon>settings</mat-icon></div>
      <div>
        <h1>Settings</h1>
        <p>Configure roles, users, security, and system preferences from one place.</p>
      </div>
    </div>
  </section>

  <div class="settings-grid">
    <a *ngFor="let card of cards" [routerLink]="card.path" class="settings-card card card--hover">
      <div class="settings-card__icon" [style.background]="card.color + '18'" [style.color]="card.color">
        <mat-icon>{{ card.icon }}</mat-icon>
      </div>
      <div class="settings-card__content">
        <h3>{{ card.label }}</h3>
        <p>{{ card.description }}</p>
      </div>
      <mat-icon class="settings-card__arrow">chevron_right</mat-icon>
    </a>
  </div>
</div>
