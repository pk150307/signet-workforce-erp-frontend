<div class="user-drawer">
  <div class="user-drawer__header">
    <h2>{{ isEditMode ? 'Edit User' : 'Create User' }}</h2>
    <button mat-icon-button (click)="close()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <app-skeleton-loader *ngIf="loading()" type="card" [rows]="6"></app-skeleton-loader>

  <form *ngIf="!loading()" class="user-drawer__form" [formGroup]="form" (ngSubmit)="save()">
    <signet-custom-text-field fieldTitle="Email" formControlName="email" type="email" [required]="false" />

    <div class="user-drawer__row">
      <signet-custom-text-field fieldTitle="First Name" formControlName="firstName" [required]="false" />
      <signet-custom-text-field fieldTitle="Last Name" formControlName="lastName" [required]="false" />
    </div>

    <signet-custom-text-field fieldTitle="Mobile" formControlName="mobile" [required]="false" />

    <mat-form-field appearance="outline">
      <mat-label>Roles</mat-label>
      <mat-select formControlName="roleIds" multiple>
        <mat-option *ngFor="let role of roles()" [value]="role.id">{{ role.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <signet-custom-checkbox formControlName="isActive" label="Active" permissionKey="isActive" groupName="form" />
    <signet-custom-checkbox *ngIf="!isEditMode" formControlName="forcePasswordReset" label="Force password reset on first login" permissionKey="forcePasswordReset" groupName="form" />

    <div class="user-drawer__meta" *ngIf="detail() as user">
      <mat-divider></mat-divider>
      <p><strong>Status:</strong> {{ user.status }}</p>
      <p *ngIf="user.accountLocked"><strong>Account locked</strong></p>
      <p *ngIf="user.lastLoginAt"><strong>Last login:</strong> {{ user.lastLoginAt | date:'medium' }}</p>
    </div>

    <div class="user-drawer__actions">
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Cancel" (clicked)="close()" />
      <signet-button [width]="100" [widthUnit]="'%'" type="primary" [displayText]="saving() ? 'Saving…' : (isEditMode ? 'Save Changes' : 'Create User')" [disabled]="saving() || (isEditMode ? !canUpdate : !canCreate)" (clicked)="save()" />
    </div>
  </form>
</div>
