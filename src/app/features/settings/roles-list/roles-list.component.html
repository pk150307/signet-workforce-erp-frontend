<mat-sidenav-container class="roles-list__container">
  <mat-sidenav-content>
    <div class="page-container settings-page">
      <app-settings-subnav></app-settings-subnav>

      <div class="page-header">
        <div>
          <h1 class="page-header__title">Roles</h1>
          <p class="page-header__subtitle">{{ data()?.items?.length ?? 0 }} records</p>
        </div>
        <div class="page-header__actions">
          <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Refresh" (clicked)="load()" />
        </div>
      </div>

      <div class="filters-card card settings-filters">
        <signet-custom-text-field class="settings-filters__search" fieldTitle="Search roles" [formControl]="searchCtrl" placeholder="Search roles..." [required]="false" />
      </div>

      <app-skeleton-loader *ngIf="loading()" type="table" [rows]="6"></app-skeleton-loader>

      <div class="card card--flush" *ngIf="!loading()">
        <app-empty-state *ngIf="data()?.items?.length === 0" icon="admin_panel_settings" title="No roles found" description="No roles match your search."></app-empty-state>

        <div class="data-list-scroll" *ngIf="(data()?.items?.length ?? 0) > 0">
          <div class="data-list">
            <div class="data-list__header">
              <div class="data-list__cell">Role</div>
              <div class="data-list__cell">Description</div>
              <div class="data-list__cell">Users</div>
              <div class="data-list__cell">Permissions</div>
              <div class="data-list__cell">System</div>
              <div class="data-list__cell">Active</div>
              <div class="data-list__cell data-list__cell--center"></div>
            </div>
            @for (row of data()?.items ?? []; track row.id) {
              <div class="data-list__row">
                <div class="data-list__cell">{{ row.name }}</div>
                <div class="data-list__cell">{{ row.description || '—' }}</div>
                <div class="data-list__cell">{{ row.userCount }}</div>
                <div class="data-list__cell">{{ row.permissionCount }}</div>
                <div class="data-list__cell">{{ row.isSystem ? 'Yes' : 'No' }}</div>
                <div class="data-list__cell">
                  <signet-status-button [label]="row.isActive ? 'Active' : 'Inactive'" [status]="row.isActive" />
                </div>
                <div class="data-list__cell data-list__cell--center">
                  <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Permissions" (clicked)="openPermissions(row)" />
                </div>
              </div>
            }
          </div>
        </div>

<signet-pagination
      *ngIf="data()"
      [hasPrev]="pager.hasPrev"
      [hasNext]="pager.hasNext"
      [prevCursor]="pager.currentPrevCursor"
      [nextCursor]="pager.currentNextCursor"
      [pageSize]="pager.pageSize"
      (pageChange)="onPaginationNavigate($event)"
    />
</div>
    </div>
  </mat-sidenav-content>

  <mat-sidenav class="roles-list__drawer" position="end" mode="over" [opened]="drawerOpen()" (closedStart)="closeDrawer()">
    <app-role-permissions-drawer *ngIf="selectedRoleId() as roleId" [roleId]="roleId" (closed)="closeDrawer()" (saved)="onSaved()"></app-role-permissions-drawer>
  </mat-sidenav>
</mat-sidenav-container>
