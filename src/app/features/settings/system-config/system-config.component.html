<div class="page-container settings-page">
      <app-settings-subnav></app-settings-subnav>

  <div class="page-header">
    <div>
      <h1 class="page-header__title">System Config</h1>
      <p class="page-header__subtitle">Configure company-wide system preferences</p>
    </div>
    <div class="page-header__actions">
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Refresh" (clicked)="load()" />
      <signet-button [width]="100" [widthUnit]="'%'" type="primary" displayText="Save Changes" [disabled]="form.invalid || saving()" (clicked)="save()" />
    </div>
  </div>

  <app-skeleton-loader *ngIf="loading()" type="card" [rows]="4"></app-skeleton-loader>

  <form class="card settings-form-card config-form" *ngIf="!loading()" [formGroup]="form">
    <div class="form-grid">
      <signet-custom-text-field fieldTitle="Company Name" formControlName="companyName" [required]="false" />
      <signet-search-select-dropdown
        formControlName="timezone"
        fieldTitle="Timezone"
        placeholder="Select timezone"
        [options]="timezoneOptions()"
        [searchFunctionality]="false"
        [width]="100"
        widthUnit="%"
      />
      <signet-search-select-dropdown
        formControlName="dateFormat"
        fieldTitle="Date Format"
        placeholder="Select date format"
        [options]="dateFormatOptions()"
        [searchFunctionality]="false"
        [width]="100"
        widthUnit="%"
      />
      <signet-search-select-dropdown
        formControlName="currency"
        fieldTitle="Currency"
        placeholder="Select currency"
        [options]="currencyOptions()"
        [searchFunctionality]="false"
        [width]="100"
        widthUnit="%"
      />
      <signet-search-select-dropdown
        formControlName="fiscalYearStart"
        fieldTitle="Fiscal Year Start"
        placeholder="Select month"
        [options]="fiscalYearStartOptions()"
        [searchFunctionality]="false"
        [width]="100"
        widthUnit="%"
      />
      <signet-custom-text-field fieldTitle="Session Timeout (minutes)" formControlName="sessionTimeoutMinutes" type="number" [required]="false" />
    </div>
    <div class="toggle-row">
      <mat-slide-toggle formControlName="enableTwoFactor">Enable Two-Factor Authentication</mat-slide-toggle>
      <mat-slide-toggle formControlName="enableAuditLog">Enable Audit Logging</mat-slide-toggle>
    </div>
  </form>
</div>
