<div class="print-toolbar no-print">
  <div class="print-toolbar__left">
    <strong>Invoice Preview</strong>
    <span *ngIf="invoice() as inv">{{ inv.invoiceNumber }}</span>
  </div>
  <div class="print-toolbar__actions">
    <signet-button [width]="100" [widthUnit]="'%'"
      type="stroke"
      [displayText]="downloading() ? 'Generating…' : 'Download PDF'"
      [disabled]="(!invoice() && !useServerHtml()) || downloading()"
      (clicked)="downloadPdf()"
    />
    <signet-button [width]="100" [widthUnit]="'%'"
      type="primary"
      displayText="Print"
      [disabled]="!invoice() && !useServerHtml()"
      (clicked)="print()"
    />
  </div>
</div>

<div class="loading-state no-print" *ngIf="loading()">
  <app-skeleton-loader type="card" [rows]="10"></app-skeleton-loader>
</div>

<div class="invoice-preview-wrap" *ngIf="!loading() && useServerHtml() && serverHtml() as html">
  <div class="server-invoice-html" [innerHTML]="html"></div>
</div>

<div class="invoice-preview-wrap" *ngIf="!loading() && !useServerHtml() && invoice() as inv">
  <app-invoice-document [inv]="inv" />
</div>
