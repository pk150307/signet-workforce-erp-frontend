<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-header__title">Bulk Shift Assignment</h1>
      <p class="page-header__subtitle">Assign a shift to multiple employees at once</p>
    </div>
    <a routerLink="/shifts" class="signet-btn-link"><signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Back to Shifts" /></a>
  </div>

  <app-skeleton-loader *ngIf="loading() || saving()" type="table" [rows]="6"></app-skeleton-loader>

  <div *ngIf="!loading() && !saving()">
    <div class="card assign-config">
      <form [formGroup]="form">
        <div class="form-row">
          <signet-search-select-dropdown
            formControlName="shiftId"
            fieldTitle="Shift"
            placeholder="Select shift"
            [options]="shiftOptions()"
            [width]="100"
            widthUnit="%"
            [searchFunctionality]="true"
            [required]="true"
          />
          <signet-date-input-field
            fieldTitle="Effective From"
            placeholder="Select date"
            [value]="effectiveFromValue"
            (valueChange)="onEffectiveFromChange($event)"
            [required]="true"
            [width]="100"
            widthUnit="%"
          />
        </div>
      </form>
    </div>

    <div class="filter-bar">
      <signet-custom-text-field class="filter-bar__search" fieldTitle="Search" [formControl]="searchCtrl" placeholder="Search employees..." [required]="false" />
      <div class="filter-bar__actions">
        <span class="selection-count">{{ selectedIds().size }} selected</span>
      </div>
    </div>

    <div class="card card--flush">
      <div class="data-list-scroll" *ngIf="filteredEmployees.length > 0">
        <div class="data-list">
          <div class="data-list__header">
            <div class="data-list__cell data-list__cell--center">
              <signet-custom-checkbox [checked]="allSelected()" (permissionToggled)="toggleAll($event.checked)" label="" permissionKey="all" groupName="shift" />
            </div>
            <div class="data-list__cell">Code</div>
            <div class="data-list__cell">Employee</div>
            <div class="data-list__cell">Department</div>
            <div class="data-list__cell">Current Shift</div>
          </div>
          @for (e of filteredEmployees; track e.id) {
            <div class="data-list__row">
              <div class="data-list__cell data-list__cell--center">
                <signet-custom-checkbox [checked]="isSelected(e.id)" (permissionToggled)="toggleEmployee(e.id)" label="" permissionKey="emp" groupName="shift" />
              </div>
              <div class="data-list__cell"><span class="code-chip">{{ e.employeeCode }}</span></div>
              <div class="data-list__cell"><strong>{{ e.fullName }}</strong></div>
              <div class="data-list__cell">{{ e.department }}</div>
              <div class="data-list__cell">{{ e.currentShift || '—' }}</div>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="form-actions">
      <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Cancel" (clicked)="router.navigate(['/shifts'])" />
      <signet-button [width]="100" [widthUnit]="'%'" type="primary" displayText="Assign Shift ({{ selectedIds().size }})" [disabled]="saving()" (clicked)="onSubmit()" />
    </div>
  </div>
</div>
