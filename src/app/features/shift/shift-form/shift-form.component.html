<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-header__title">{{ isEdit() ? 'Edit Shift' : 'Add Shift' }}</h1>
    </div>
    <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Cancel" (clicked)="router.navigate(['/shifts'])" />
  </div>

  <app-skeleton-loader *ngIf="loading() || saving()" type="card" [rows]="6"></app-skeleton-loader>

  <div class="card form-card" *ngIf="!loading() && !saving()">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <signet-custom-text-field fieldTitle="Shift Code" formControlName="shiftCode" [required]="true" />
        <signet-custom-text-field fieldTitle="Shift Name" formControlName="shiftName" [required]="true" />
      </div>
      <div class="form-row">
        <signet-custom-text-field fieldTitle="Start Time *" formControlName="startTime" type="text" placeholder="HH:MM" [required]="true" />
        <signet-custom-text-field fieldTitle="End Time *" formControlName="endTime" type="text" placeholder="HH:MM" [required]="true" />
        <signet-custom-text-field fieldTitle="Break (minutes)" formControlName="breakMinutes" type="number" [required]="true" />
        <signet-custom-text-field fieldTitle="Grace (minutes)" formControlName="graceMinutes" type="number" [required]="false" />
      </div>
      <div class="form-row">
        <signet-search-select-dropdown
          formControlName="weeklyOff"
          fieldTitle="Weekly Off"
          placeholder="Select weekly off"
          [options]="weeklyOffOptions()"
          [width]="100"
          widthUnit="%"
          [searchFunctionality]="false"
          [required]="true"
        />
      </div>
      <div class="toggle-row">
        <mat-slide-toggle formControlName="isNightShift">Night Shift</mat-slide-toggle>
        <mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
      </div>
      <div class="form-actions">
        <signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Cancel" (clicked)="router.navigate(['/shifts'])" />
        <signet-button [width]="100" [widthUnit]="'%'" type="primary" displayText="{{ isEdit() ? 'Save Changes' : 'Create Shift' }}" [disabled]="saving()" (clicked)="onSubmit()" />
      </div>
    </form>
  </div>
</div>
