<div class="page-container">
  <div class="page-header"><div><h1 class="page-header__title">Leave Types</h1><p class="page-header__subtitle">{{ data()?.items?.length ?? 0 }} records</p></div>
    <div class="page-header__actions"><signet-button [width]="100" [widthUnit]="'%'" type="stroke" displayText="Refresh" (clicked)="load()" /></div></div>
  <div class="filter-bar"><signet-custom-text-field class="filter-bar__search" fieldTitle="Search" [formControl]="searchCtrl" placeholder="Search..." [required]="false" /></div>
  <app-skeleton-loader *ngIf="loading()" type="table" [rows]="6"></app-skeleton-loader>
  <div class="card card--flush" *ngIf="!loading()">
    <app-empty-state *ngIf="data()?.items?.length === 0" icon="beach_access" title="No records" description="No leave records found."></app-empty-state>
    <div class="data-list-scroll" *ngIf="(data()?.items?.length ?? 0) > 0">
      <div class="data-list">
        <div class="data-list__header">
          <div class="data-list__cell">Code</div>
          <div class="data-list__cell">Name</div>
          <div class="data-list__cell">Max Days</div>
          <div class="data-list__cell">Paid</div>
          <div class="data-list__cell">Active</div>
        </div>
        @for (row of data()?.items ?? []; track row.id ?? $index) {
          <div class="data-list__row">
            <div class="data-list__cell">{{ row.leaveCode ?? '—' }}</div>
            <div class="data-list__cell">{{ row.leaveName ?? '—' }}</div>
            <div class="data-list__cell">{{ row.maxDays ?? '—' }}</div>
            <div class="data-list__cell">{{ row.isPaid ?? '—' }}</div>
            <div class="data-list__cell">{{ row.isActive ?? '—' }}</div>
          </div>
        }
      </div>
    </div>
<signet-pagination
      *ngIf="data()"
      [hasPrev]="pager.hasPrev"
      [hasNext]="pager.hasNext"
      [prevCursor]="pager.currentPrevCursor"
      [nextCursor]="pager.currentNextCursor"
      [pageSize]="pager.pageSize"
      (pageChange)="onPaginationNavigate($event)"
    />
</div></div>
