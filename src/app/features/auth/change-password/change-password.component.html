<div class="page-container change-password">
  <div class="page-header">
    <div>
      <h1 class="page-header__title">Change Password</h1>
      <p class="page-header__subtitle">Update your account password</p>
    </div>
  </div>

  <div class="card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="change-password__form">
      <signet-custom-text-field
        class="change-password__field"
        [fieldTitle]="'Current Password'"
        type="password"
        formControlName="currentPassword"
        placeholder="Enter current password"
        autocomplete="current-password"
        [showError]="!!(form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched)"
        [errorMessage]="'Current password is required'"
      />

      <signet-custom-text-field
        class="change-password__field"
        [fieldTitle]="'New Password'"
        [type]="hideNewPassword() ? 'password' : 'text'"
        formControlName="newPassword"
        placeholder="Enter new password"
        autocomplete="new-password"
        [suffixIcon]="'/assets/images/icons/user-access/eye-line.png'"
        (iconClicked)="toggleNewPasswordVisibility()"
        [showError]="!!(form.get('newPassword')?.invalid && form.get('newPassword')?.touched)"
        [errorMessage]="form.get('newPassword')?.hasError('required') ? 'New password is required' : 'Password does not meet security requirements'"
      />

      <app-password-strength [password]="form.get('newPassword')?.value ?? ''" />

      <signet-custom-text-field
        class="change-password__field"
        [fieldTitle]="'Confirm New Password'"
        type="password"
        formControlName="confirmPassword"
        placeholder="Confirm new password"
        autocomplete="new-password"
        [showError]="!!(form.hasError('mismatch') && form.get('confirmPassword')?.touched)"
        [errorMessage]="'Passwords do not match'"
      />

      <signet-button [widthUnit]="'%'" class="change-password__submit"
        type="primary"
        [displayText]="loading() ? 'Updating…' : 'Update Password'"
        [disabled]="loading()"
        [width]="100"
        widthUnit="%"
        [height]="48"
      />
    </form>
  </div>
</div>
