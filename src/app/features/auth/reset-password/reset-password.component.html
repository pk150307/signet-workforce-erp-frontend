<app-auth-layout title="Reset Password" subtitle="Create a new password for your account.">
  @if (!token()) {
    <p class="token-error">
      This reset link is invalid or has expired. Please request a new password reset link.
    </p>
    <signet-button [widthUnit]="'%'" class="reset-form__submit"
      type="primary"
      displayText="Request New Link"
      [width]="100"
      widthUnit="%"
      [height]="48"
      (clicked)="router.navigate(['/auth/forgot-password'])"
    />
  } @else if (!submitted()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-form">
      <signet-custom-text-field
        class="reset-form__field"
        [fieldTitle]="'New Password'"
        [type]="hidePassword() ? 'password' : 'text'"
        formControlName="password"
        placeholder="Enter new password"
        autocomplete="new-password"
        [suffixIcon]="'/assets/images/icons/user-access/eye-line.png'"
        (iconClicked)="togglePasswordVisibility()"
        [showError]="!!(form.get('password')?.invalid && form.get('password')?.touched)"
        [errorMessage]="form.get('password')?.hasError('required') ? 'Password is required' : 'Password does not meet security requirements'"
      />

      <app-password-strength [password]="form.get('password')?.value ?? ''" />

      <signet-custom-text-field
        class="reset-form__field"
        [fieldTitle]="'Confirm Password'"
        type="password"
        formControlName="confirmPassword"
        placeholder="Confirm new password"
        autocomplete="new-password"
        [showError]="!!(form.hasError('mismatch') && form.get('confirmPassword')?.touched)"
        [errorMessage]="'Passwords do not match'"
      />

      <signet-button [widthUnit]="'%'" class="reset-form__submit"
        type="primary"
        [displayText]="loading() ? 'Resetting…' : 'Reset Password'"
        [disabled]="loading()"
        [width]="100"
        widthUnit="%"
        [height]="48"
      />
    </form>
  } @else {
    <div class="success-panel">
      <div class="success-panel__icon">
        <mat-icon>check_circle</mat-icon>
      </div>
      <h2 class="success-panel__title">Password updated</h2>
      <p class="success-panel__message">
        Your password has been reset successfully. Sign in with your new password.
      </p>
      <signet-button [widthUnit]="'%'" class="success-panel__action"
        type="primary"
        displayText="Go to Sign In"
        [width]="100"
        widthUnit="%"
        [height]="48"
        (clicked)="router.navigate(['/auth/login'])"
      />
    </div>
  }
</app-auth-layout>
