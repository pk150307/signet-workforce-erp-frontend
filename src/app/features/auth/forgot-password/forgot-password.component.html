<app-auth-layout
  title="Forgot Password"
  subtitle="Enter your email and we'll send you a reset link.">
  @if (!submitted()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="forgot-form">
      <signet-custom-text-field
        class="forgot-form__field"
        [fieldTitle]="'Email Address'"
        type="email"
        formControlName="email"
        placeholder="you@company.com"
        autocomplete="email"
        [showError]="!!(form.get('email')?.invalid && form.get('email')?.touched)"
        [errorMessage]="form.get('email')?.hasError('required') ? 'Email is required' : 'Enter a valid email'"
      />

      <signet-button [widthUnit]="'%'" class="forgot-form__submit"
        type="primary"
        [displayText]="loading() ? 'Sending…' : 'Send Reset Link'"
        [disabled]="loading()"
        [width]="100"
        widthUnit="%"
        [height]="48"
      />
    </form>
  } @else {
    <div class="success-panel">
      <div class="success-panel__icon">
        <mat-icon>mark_email_read</mat-icon>
      </div>
      <h2 class="success-panel__title">Check your email</h2>
      <p class="success-panel__message">
        If an account exists for that address, we've sent password reset instructions.
        The link expires in 30 minutes.
      </p>
      <signet-button [widthUnit]="'%'" class="success-panel__action"
        type="primary"
        displayText="Back to Sign In"
        [width]="100"
        widthUnit="%"
        [height]="48"
        (clicked)="router.navigate(['/auth/login'])"
      />
    </div>
  }
</app-auth-layout>
